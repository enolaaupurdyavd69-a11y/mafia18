plugins { id 'com.android.application' }

android {
    namespace 'ru.romashko.mafia18'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'ru.romashko.mafia18'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug  // ставим файлом, не через магазин
        }
    }
    lint { checkReleaseBuilds false }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}


